# Build and test the C port, produce release binaries for multiple platforms
name: C Build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Test harness needs python3.12 to run the Python oracle side-by-side
      # (run_zxbpp_tests.sh, run_zxbasm_tests.sh — both Unix AND Windows).
      # Strict — falls over loudly if the interpreter is missing.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure CMake
        run: cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build csrc/build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build csrc/build --config Release -j $env:NUMBER_OF_PROCESSORS

      # Production layout sanity — the multicall binary and its three
      # applet entries (zxbpp / zxbasm / zxbc) must be present under the
      # repo-root bin/ and runnable. Tests below invoke via these names,
      # proving the shipping path, not a side-built standalone.
      - name: Verify multicall layout (Unix)
        if: runner.os != 'Windows'
        run: |
          test -x bin/zxbasic-suite
          test -L bin/zxbpp
          test -L bin/zxbasm
          test -L bin/zxbc
          ./bin/zxbpp --help >/dev/null
          ./bin/zxbasm --help >/dev/null
          ./bin/zxbasic-suite zxbpp --help >/dev/null

      - name: Verify multicall layout (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -x bin/Release/zxbasic-suite.exe
          test -f bin/Release/zxbpp.exe
          test -f bin/Release/zxbasm.exe
          test -f bin/Release/zxbc.exe

      - name: Run zxbpp tests (Unix)
        if: runner.os != 'Windows'
        run: ./csrc/tests/run_zxbpp_tests.sh ./bin/zxbpp tests/functional/zxbpp

      - name: Run zxbasm tests (Unix)
        if: runner.os != 'Windows'
        run: ./csrc/tests/run_zxbasm_tests.sh ./bin/zxbasm tests/functional/asm

      # Unit tests now share bin/ with the production tools (single
      # runtime output dir). ctest is the canonical runner; this step
      # invokes it directly so failures are wired into the workflow's
      # exit code rather than aggregated into a separate target.
      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: cd csrc/build && ctest --output-on-failure

      # Note: csrc/tests/run_cmdline_tests.sh was deleted in Round 0
      # (Sprint 11) as a fuzzy harness. The 15 value-verifying cmdline
      # tests it ran are replaced by the test_cmdline C binary above.

      # zxbpp text tests skipped on Windows — #line paths differ.
      # Build verification is sufficient; text output is validated on Unix.

      - name: Run zxbasm tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./csrc/tests/run_zxbasm_tests.sh ./bin/Release/zxbasm.exe tests/functional/asm

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cd csrc/build && ctest -C Release --output-on-failure

      # Ship a SELF-CONTAINED, SYMLINK-FREE artifact. The artifact must be
      # able to COMPILE, so it carries src/lib/ (the stdlib tree) alongside
      # the ONE real multicall binary — a binaries-only artifact compiles
      # nothing. On Unix the three applet entries are NOT staged as symlinks:
      # actions/upload-artifact@v4's zipper FOLLOWS symlinks, which would
      # explode each link into a full copy of the suite (four copies total).
      # Instead we tar the staged tree ourselves (tar preserves nothing we
      # rely on — there are no symlinks to preserve) and a small install.sh
      # recreates the applet symlinks after extraction. Windows has no
      # symlink primitive, so it copies the .exes under each applet name and
      # uploads a plain directory (no zipper-symlink hazard there).
      - name: Stage release tree (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact/bin
          cp -a bin/zxbasic-suite artifact/bin/
          cp -a src/lib artifact/src-lib-tmp
          mkdir -p artifact/src
          mv artifact/src-lib-tmp artifact/src/lib
          cp csrc/scripts/install.sh artifact/install.sh
          chmod +x artifact/install.sh
          tar czf "${{ matrix.artifact }}-zxbasic-suite.tar.gz" -C artifact .

      # Sanity-check the SHIPPED layout: extract the tar, run install.sh to
      # recreate the symlinks, then compile a hello-world to .tap through the
      # extracted bin/zxbc WITH NO ZXBASIC_INC_PATH SET — proving the one-hop
      # default (<exe_dir>/../src/lib) works in the artifact's own layout.
      - name: Sanity-check artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          tmp=$(mktemp -d)
          tar xzf "${{ matrix.artifact }}-zxbasic-suite.tar.gz" -C "$tmp"
          sh "$tmp/install.sh"
          test -L "$tmp/bin/zxbc"
          printf '10 PRINT "HELLO WORLD!"\n' > "$tmp/hello.bas"
          ( cd "$tmp" && unset ZXBASIC_INC_PATH && \
            ./bin/zxbc -f tap --autorun --BASIC hello.bas )
          test -s "$tmp/hello.tap"
          echo "Artifact self-contained one-hop default OK."

      - name: Stage release tree (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifact/bin artifact/src
          cp bin/Release/zxbasic-suite.exe artifact/bin/
          cp bin/Release/zxbpp.exe artifact/bin/
          cp bin/Release/zxbasm.exe artifact/bin/
          cp bin/Release/zxbc.exe artifact/bin/
          cp -r src/lib artifact/src/lib

      - name: Upload zxbasic-suite (Unix tarball)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-zxbasic-suite
          path: ${{ matrix.artifact }}-zxbasic-suite.tar.gz

      - name: Upload zxbasic-suite (Windows directory)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-zxbasic-suite
          path: artifact

  # Compare against Python ground truth (single platform is sufficient)
  python-comparison:
    name: Python Ground Truth
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C binary
        run: |
          cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build csrc/build -j$(nproc)

      - name: Compare Python vs C output (zxbpp)
        run: ./csrc/tests/compare_python_c.sh ./bin/zxbpp tests/functional/zxbpp

      - name: Compare Python vs C output (zxbasm)
        run: ./csrc/tests/compare_python_c_asm.sh ./bin/zxbasm tests/functional/asm

  # Create release binaries when a tag is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, python-comparison]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        run: |
          cd artifacts
          mkdir -p ../release
          # Each downloaded artefact is a directory named after the artifact.
          # Unix artefacts already carry a single self-contained .tar.gz
          # (symlink-free; install.sh recreates the applet symlinks). Windows
          # artefacts are a plain directory tree (bin/*.exe + src/lib) — tar
          # those here. Nothing relies on the artifact zipper preserving
          # symlinks (there are none to preserve).
          for dir in */; do
            name="${dir%/}"
            tgz=$(find "$dir" -maxdepth 1 -name '*.tar.gz' | head -n1)
            if [ -n "$tgz" ]; then
              cp "$tgz" "../release/${name}.tar.gz"
            else
              tar czf "../release/${name}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
